# Ultimate Voice Moderation Configuration

enabled: true
voice:
  enabled: true
text:
  enabled: true

providers:
  transcription:
    # type can be 'local' or 'external_api'
    type: local
    # Rate limit for transcription requests (per player, per minute)
    rateLimit: 10
    # Maximum duration of a single voice segment to be transcribed (in seconds)
    maxSegmentLength: 10
    # Maximum number of concurrent transcription tasks
    concurrency: 2
  moderation:
    # type can be 'local_pattern_engine' or 'external_api'
    type: local_pattern_engine
    # Whether to use the local classification model (if available)
    use_local_model: false
    # Must be false by default
    external_api_enabled: false

categories:
  harassment:
    enabled: true
    threshold: 0.8
    actions: [WARN, LOG_ONLY]
    muteDuration: "10m"
    consoleCommands: []
  hate_speech:
    enabled: true
    threshold: 0.9
    actions: [KICK, PERMA_VOICE_MUTE, LOG_ONLY]
    muteDuration: "0"
    consoleCommands:
      - "ban %player% Hate Speech"
  threats:
    enabled: true
    threshold: 0.95
    actions: [KICK, PERMA_VOICE_MUTE, LOG_ONLY]
    muteDuration: "0"
    consoleCommands:
      - "ban %player% Threats"
  sexual_content:
    enabled: true
    threshold: 0.85
    actions: [WARN, TEMP_VOICE_MUTE, LOG_ONLY]
    muteDuration: "30m"
    consoleCommands: []
  self_harm:
    enabled: true
    threshold: 0.9
    actions: [WARN, LOG_ONLY]
    muteDuration: "0"
    consoleCommands: []
  explicit_language:
    enabled: true
    threshold: 0.75
    actions: [WARN, LOG_ONLY]
    muteDuration: "5m"
    consoleCommands: []

patternLists:
  hardBannedWords:
    - "fuck"
    - "shit"
    - "bitch"
  softBannedWords:
    - "frick"
    - "heck"
  regexPatterns:
    - "f[\\\\W_]*u[\\\\W_]*c[\\\\W_]*k"
    - "n[\\\\W_]*i[\\\\W_]*g[\\\\W_]*g[\\\\W_]*a"
    - "n[\\\\W_]*i[\\\\W_]*g[\\\\W_]*g[\\\\W_]*e[\\\\W_]*r"

performance:
  maxConcurrentVoiceAnalyses: 4
  maxQueueSize: 100
  maxCharactersPerSegment: 300
  timeouts: 5000
  fallbackBehavior: "drop"

logging:
  enabled: true
  file: "audit.log"
  maxEntries: 10000
  debugMode: false
